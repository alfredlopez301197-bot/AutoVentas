
name: autoventas
description: "AutoVentas: aplicación móvil para ventas, clientes, inventario y gestión de rutas."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^8.2.1

  # Pinned below latest (11.x) on purpose:
  # 11.0.0 hardcodes Android compileSdk 37.
  # 10.3.1 only needs compileSdk 36.
  flutter_secure_storage: ^10.3.1

  local_auth: ^3.0.2
  go_router: ^17.5.0
  flutter_svg: ^2.3.0

  dio: ^5.11.0
  http: ^1.2.2

  geolocator: ^13.0.2
  printing: ^5.14.2
  pdf: ^3.13.0
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  image_picker: ^1.2.1
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg
    - assets/Falling Parcel.svg
    - assets/Drones isometric Lottie animation.svg
    - assets/Delivery car logistic.gif
    - assets/Loading.gif
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/IBMPlexSansArabic-Bold.ttf
